<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메디픽 · 병원 운영키 관리</title><link rel="stylesheet" href="/assets/v3.css"><link rel="stylesheet" href="/assets/upgrade.css"><style>.opswrap{max-width:1050px;margin:auto;padding:28px 15px}.opsgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.result{word-break:break-all;white-space:pre-wrap}.key-list{display:grid;gap:10px}.key-entry{background:#f2f7f7;padding:12px;border-radius:12px;display:grid;gap:6px}.key-entry button{max-width:110px}@media(max-width:700px){.opsgrid{grid-template-columns:1fr}}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #04a595;outline-offset:2px}</style><link rel="stylesheet" href="/assets/site-shell.css"></head><body data-mp-page="clinic-access"><header class="mast"><a class="brand" href="/">✳ medi<span>pick</span></a><nav><a href="/admin">관리자</a><a class="selected" href="/clinic-access">예약 권한</a><a href="/clinic-ops">병원 담당자 화면</a></nav></header><main class="opswrap"><h1>병원 예약 담당자 권한 관리</h1><p>병원별로 조회 전용·변경 권한을 별도로 발급하고, 사용하지 않는 키는 즉시 폐기할 수 있습니다.</p><div class="opsgrid"><section class="card"><h2>관리자 인증</h2><label>관리자 암호<input type="password" id="adminPass" autocomplete="off" placeholder="관리자 암호"></label><button id="adminLogin">관리자 로그인</button><p id="authMsg" role="status">관리자 인증 필요</p></section><section class="card"><h2>새 예약담당자 접근키</h2><label>병원 ID<input type="number" id="providerId" min="1" value="1"></label><label>직원 표시명<input id="keyLabel" placeholder="예약실 직원"></label><label>접근권한<select id="permission"><option value="schedule_read">조회 전용</option><option value="schedule_manage">조회 및 예약 변경</option></select></label><button id="issue">키 발급</button><p id="issuedKey" class="result" role="status">발급한 비밀키는 화면에 한 번만 표시합니다.</p></section><section class="card" style="grid-column:1/-1"><h2>기존 키 · 폐기</h2><button id="refreshKeys">목록 조회</button><div id="keys" class="key-list"><p>로그인 후 목록을 확인할 수 있습니다.</p></div></section></div><p class="warning">시연 프로그램: 실제 병원 인사정보, MFA, 병원별 관리자 역할, HTTPS와 키 회전 정책을 적용하기 전 공용망에 배포하지 마세요.</p></main><script src="/assets/clinic-access.js" defer></script><script src="/assets/site-chrome.js" defer></script></body></html>
