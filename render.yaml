# MEDIPICK v3.3 — Python API (SQLite on persistent disk)
# Frontend domain: medipick.lexid.site (Vercel reverse proxy → this service)
services:
  - type: web
    name: medipick-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    repo: https://github.com/skvive/medipick
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MEDIPICK_HOST
        value: "0.0.0.0"
      - key: MEDIPICK_COOKIE_SECURE
        value: "1"
      - key: MEDIPICK_DB
        value: /opt/render/project/src/data/medipick.sqlite3
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEDIPICK_ADMIN_PASSWORD
        sync: false
      - key: MEDIPICK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
