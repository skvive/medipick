name: MEDIPICK all-page responsive UI quality gate

on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/qa-web-responsive.py'
      - '.github/workflows/medipick-web-ux-qa.yml'
  push:
    branches:
      - 'chatgpt/medipick-*'
    paths:
      - 'web/**'
      - 'scripts/qa-web-responsive.py'
      - '.github/workflows/medipick-web-ux-qa.yml'

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing QA toolchain (Playwright and BeautifulSoup)
        run: |
          python -m pip install --no-cache-dir 'playwright==1.56.0' 'beautifulsoup4==4.14.2'
          python -m playwright install --with-deps chromium
      - name: Render all MEDIPICK pages across five widths and exercise navigation
        env:
          MEDIPICK_QA_OUTPUT: ${{ runner.temp }}/medipick-agency-qa
        run: python scripts/qa-web-responsive.py
      - name: Upload all-page actual screenshot and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MEDIPICK-AllPages-Responsive-QA
          path: ${{ runner.temp }}/medipick-agency-qa
          if-no-files-found: warn
          retention-days: 14
