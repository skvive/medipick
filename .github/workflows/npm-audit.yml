name: MEDIPICK npm audit report
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect dependency audit
        run: npm audit --json > npm-audit-report.json || true
      - name: Preview automatic remediation
        run: npm audit fix --dry-run > npm-audit-fix-plan.txt 2>&1 || true
      - name: Print audit and fix summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const vulnerabilities = Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable
          }));
          console.log(JSON.stringify({ current: audit.metadata?.vulnerabilities, findings: vulnerabilities }, null, 2));
          NODE
          cat npm-audit-fix-plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MEDIPICK-npm-audit-report
          path: |
            npm-audit-report.json
            npm-audit-fix-plan.txt
          if-no-files-found: error
