name: MEDIPICK npm audit report
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect dependency audit
        run: npm audit --json > npm-audit-report.json || true
      - name: Print finding summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            via: (item.via || []).map(advisory => typeof advisory === 'string'
              ? { name: advisory }
              : { name: advisory.name, title: advisory.title, url: advisory.url, range: advisory.range }),
            fixAvailable: item.fixAvailable
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: MEDIPICK-npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error
