name: MEDIPICK admin auth security regression

on:
  pull_request:
    paths:
      - 'lib/medipick/auth.ts'
      - 'web/admin.html'
      - 'tests/admin-auth-security.test.mjs'
      - '.github/workflows/medipick-admin-auth-security.yml'
  push:
    branches:
      - 'chatgpt/medipick-*'
    paths:
      - 'lib/medipick/auth.ts'
      - 'web/admin.html'
      - 'tests/admin-auth-security.test.mjs'
      - '.github/workflows/medipick-admin-auth-security.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify admin fail-closed behavior and cookie integrity
        run: node --test tests/admin-auth-security.test.mjs
      - name: Verify build does not mutate database
        run: node scripts/check-deploy-build-safety.mjs
