name: Dependency security audit
on:
  push:
    branches:
      - chatgpt/medipick-dependency-security-20261106
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install from committed lockfile without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture npm audit report
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify(v, null, 2));
          if ((v.moderate || 0) + (v.high || 0) + (v.critical || 0) > 0) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: medipick-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
