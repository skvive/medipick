name: MEDIPICKiOS
options:
  bundleIdPrefix: site.lexid
  developmentLanguage: ko
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MEDIPICKiOS:
    type: application
    platform: iOS
    sources:
      - path: MEDIPICKiOS
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.lexid.medipick
        INFOPLIST_FILE: MEDIPICKiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          ENABLE_TESTABILITY: 'YES'
    preBuildScripts:
      - name: Restore opaque iOS AppIcon
        script: |
          set -euo pipefail
          ASSET="$SRCROOT/MEDIPICKiOS/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ ! -s "$ASSET" ]; then
            swift "$SRCROOT/tools/generate_ios_icon.swift" "$SRCROOT/../web/assets/pwa/icon-512.png" "$ASSET"
          fi
  MEDIPICKiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MEDIPICKiOSTests]
    dependencies:
      - target: MEDIPICKiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.lexid.medipick.tests
